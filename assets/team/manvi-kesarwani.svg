<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neo-brutalist circle with border -->
  <circle cx="120" cy="120" r="110" fill="#FCE8E6"/>
  <circle cx="120" cy="120" r="110" stroke="#1E1E1E" stroke-width="5"/>
  
  <g clip-path="url(#clip_manvi-kesarwani)">
    <!-- DevFest T-Shirt / Hoodie -->
    <path d="M40 240 C 40 180, 75 165, 120 165 C 165 165, 200 180, 200 240 Z" fill="#EA4335"/>
    <path d="M100 165 C 105 185, 135 185, 140 165 Z" fill="#F7D7B5"/>
    
    <!-- DevFest Lanyard -->
    <path d="M105 165 L115 220 L125 220 L135 165" stroke="#1E1E1E" stroke-width="3" fill="none"/>
    <rect x="110" y="215" width="20" height="25" rx="3" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
    <rect x="114" y="222" width="12" height="2" fill="#EA4335"/>
    
    <!-- Neck -->
    <rect x="105" y="140" width="30" height="30" fill="#F7D7B5"/>
    
    <!-- Face -->
    <ellipse cx="120" cy="115" rx="42" ry="48" fill="#F7D7B5"/>
    
    <!-- Ears -->
    <circle cx="78" cy="118" r="10" fill="#F7D7B5"/>
    <circle cx="162" cy="118" r="10" fill="#F7D7B5"/>
    
    <!-- Eyes -->
    <circle cx="102" cy="114" r="5" fill="#1E1E1E"/>
    <circle cx="138" cy="114" r="5" fill="#1E1E1E"/>
    <circle cx="104" cy="112" r="1.5" fill="#FFFFFF"/>
    <circle cx="140" cy="112" r="1.5" fill="#FFFFFF"/>
    
    <!-- Eyebrows -->
    <path d="M92 102 Q 102 98 112 103" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M128 103 Q 138 98 148 102" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Nose -->
    <path d="M120 114 L118 126 L124 126" stroke="#C88E5E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Smile -->
    <path d="M108 136 Q 120 148 132 136" stroke="#A74B46" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Cheeks -->
    <circle cx="95" cy="126" r="6" fill="#EA4335" opacity="0.2"/>
    <circle cx="145" cy="126" r="6" fill="#EA4335" opacity="0.2"/>
    
    
    
    <!-- Female hairstyle -->
    <path d="M65 110 C 65 50, 175 50, 175 110 C 185 140, 185 170, 180 185 C 170 170, 170 130, 165 110 C 150 75, 90 75, 75 110 C 70 130, 70 170, 60 185 C 55 170, 55 140, 65 110 Z" fill="#2C3E50"/>
    <path d="M75 90 C 95 65, 145 65, 165 90 C 150 75, 90 75, 75 90 Z" fill="#2C3E50"/>
    
  </g>
  
  <!-- Outer clip boundary -->
  <defs>
    <clipPath id="clip_manvi-kesarwani">
      <circle cx="120" cy="120" r="107"/>
    </clipPath>
  </defs>
  
  <!-- Mini badge pill at bottom-right -->
  <g transform="translate(160, 160)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="3"/>
    <circle cx="20" cy="20" r="14" fill="#EA4335"/>
    <path d="M16 20 L19 23 L25 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>